name: GradeFlow backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/gradeflow-backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/gradeflow-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gradeflow
          POSTGRES_PASSWORD: gradeflow_dev
          POSTGRES_DB: gradeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradeflow -d gradeflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://gradeflow:gradeflow_dev@localhost:5432/gradeflow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run API tests
        run: pytest
      - name: Verify migration SQL generation
        run: alembic upgrade head --sql
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
      - name: Build backend container image
        run: docker build -t gradeflow-api:ci .

      - name: Start full Docker Compose stack
        run: docker compose -f ../docker-compose.yml up -d --build

      - name: Smoke test frontend and API through the local stack
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then
              echo "Frontend and API are responding."
              exit 0
            fi
            sleep 2
          done
          docker compose -f ../docker-compose.yml logs
          exit 1

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f ../docker-compose.yml down -v
