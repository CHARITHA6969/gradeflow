name: GradeFlow backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/gradeflow-backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/gradeflow-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run API tests
        run: pytest
