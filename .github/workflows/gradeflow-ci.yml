name: GradeFlow frontend CI

on:
  push:
    paths:
      - "gradeflow/**"
      - ".github/workflows/gradeflow-ci.yml"
  pull_request:
    paths:
      - "gradeflow/**"
      - ".github/workflows/gradeflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradeflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gradeflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Build production bundle
        run: npm run build
